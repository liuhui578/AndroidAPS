name: AAPS 2.6.2 CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 2.6.2
        uses: actions/checkout@v4
        with:
          ref: 262-build
          fetch-depth: 1

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Prepare signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build full release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aaps-2622-apk
          path: |
            app/build/outputs/apk/full/release/*.apk
            wear/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
